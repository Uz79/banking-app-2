  <script>
    /* Boot: apply saved Light/Dark + custom colour theme before paint.
       Profile > Theme (js/theme-engine.js) stores the finished --color-* tokens
       for both shells in uzBankWebColorTokens, so this only copies them onto
       <html>; no colour maths here. No entry = the UZ Bank look from tokens.css. */
    (function () {
      try {
        var t = localStorage.getItem('uzBankWebTheme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        var raw = localStorage.getItem('uzBankWebColorTokens');
        if (!raw) return;
        var all = JSON.parse(raw);
        var shell = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
        var tokens = all && all[shell];
        if (!tokens) return;
        var s = document.documentElement.style;
        for (var k in tokens) s.setProperty('--' + k, tokens[k]);
      } catch (e) {}
    })();
  </script>
